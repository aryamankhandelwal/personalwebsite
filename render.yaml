services:
  - type: web
    name: personalwebsite-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personalwebsite-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
  - type: postgres
    name: personalwebsite-db
    plan: free 