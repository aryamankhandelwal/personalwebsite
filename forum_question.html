<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Thread</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/header.png">
    <style>
        .thread-container { max-width: 700px; margin: 40px auto; }
        .question-main { background: #333; border-radius: 8px; box-shadow: 0 2px 8px #0001; margin-bottom: 18px; padding: 12px 16px; }
        .reply { background: #333; border-radius: 6px; box-shadow: 0 1px 4px #0001; margin-bottom: 12px; padding: 12px 16px; }
        .admin-controls { margin-top: 18px; }
        .admin-controls input { margin-right: 8px; background: #000; border: 1px solid #333; color: #fff; padding: 8px; font-size: 0.85rem; }
        .reply-form { margin-top: 24px; }
        .reply-form textarea { width: 100%; min-height: 60px; padding: 8px; background: #000; border: 1px solid #333; color: #fff; font-size: 0.85rem; }
        .reply-form button { margin-top: 8px; background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 16px; font-size: 0.85rem; cursor: pointer; }
        .delete-btn { color: #c00; background: none; border: none; cursor: pointer; margin-left: 8px; font-size: 0.85rem; }
        .edit-btn { color: #4169e1; background: none; border: none; cursor: pointer; margin-left: 8px; font-size: 0.85rem; }
        .edited-label { color: #888; font-size: 0.9em; margin-left: 6px; }
        .admin-reply-block { background: #333; padding: 10px; border-radius: 6px; margin-top: 8px; color: #fff; }
        .back-link {
            color: #fff !important;
            text-decoration: underline;
            font-size: 0.85rem;
        }
        .back-link:hover {
            color: #8bb3ff !important;
        }
        .admin-btn:hover {
            color: #8bb3ff !important;
        }
        .sticky-add-btn { position: fixed; bottom: 32px; right: 32px; background: #fff; color: #000; border: none; border-radius: 50px; padding: 10px 20px; font-size: 0.85rem; cursor: pointer; box-shadow: 0 2px 8px #0002; z-index: 100; }
        .sticky-add-btn:hover { background: #000; color: #fff; border: 1px solid #fff; }
        .modal-btn:hover {
            color: #8bb3ff !important;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html">Aryaman Khandelwal</a></div>
    </nav>
    <section class="main">
        <div class="main-container">
            <div class="blog-first" style="margin-top:2rem;">
                <div style="margin-bottom:1rem;">
                    <span style="color:#fff;font-size:0.85rem;">< </span><a href="forum.html" class="back-link">Back</a>
                </div>
                <div class="thread-container" style="text-align:left;">
                    <div id="questionBlock"></div>
                    
                    <!-- Replies Section -->
                    <div id="repliesSection" style="margin-top: 24px;">
                        <h3 style="color:#fff;font-size:0.85rem;margin-bottom:1rem;">Replies</h3>
                        <div id="repliesList"></div>
                    </div>
                    
                    <div class="admin-controls">
                        <h4 style="color:#fff;font-size:0.85rem;margin-bottom:1rem;">Admin Controls</h4>
                        <input type="password" id="adminTokenInput" placeholder="Admin token">
                        <div id="adminStatus" style="margin-top:8px;color:#c00;font-size:0.85rem;"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <button class="sticky-add-btn" onclick="openAddReplyModal()">+ Add a reply</button>
    <!-- Modal for adding reply -->
    <div id="addReplyModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0008;z-index:200;align-items:center;justify-content:center;">
        <div style="background:#000;padding:32px 24px;border-radius:10px;max-width:400px;width:90vw;border:1px solid #333;">
            <h3 style="color:#fff;font-size:0.85rem;margin-bottom:1rem;">Add a Reply</h3>
            <form id="modalReplyForm">
                <textarea id="modalReplyInput" placeholder="Your reply..." required style="width:100%;min-height:80px;padding:8px;margin-bottom:10px;background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font-size:0.85rem;outline:none;resize:vertical;"></textarea>
                <button type="submit" class="modal-btn" style="padding:8px 16px;background:transparent;border:none;color:#fff;font-size:0.85rem;cursor:pointer;">Submit</button>
                <button type="button" onclick="closeAddReplyModal()" class="modal-btn" style="padding:8px 16px;margin-left:8px;background:transparent;border:none;color:#fff;font-size:0.85rem;cursor:pointer;">Cancel</button>
            </form>
            <div id="modalReplyStatus" style="margin-top:8px;color:#c00;font-size:0.85rem;"></div>
        </div>
    </div>
    <script>
    // --- Helpers ---
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    const qid = getQueryParam('id');
    let questionData = null;
    let adminToken = '';

    async function fetchThread() {
        const res = await fetch(`https://personalwebsite-xzmk.onrender.com/questions/${qid}`);
        const data = await res.json();
        questionData = data.question;
        // Render question
        let questionHtml = `<div class="question-main" style="position:relative;">
            <div style="position:absolute;top:8px;right:8px;display:flex;gap:8px;">
                <button onclick="showQuestionAnswerBox()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.color='#8bb3ff'" onmouseout="this.style.color='#fff'">+</button>
                <button onclick="deleteThread()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.color='#c00'" onmouseout="this.style.color='#fff'">×</button>
            </div>
            <div style="font-size:0.85rem;color:#fff;">${data.question.text}</div>
            <div style="color:#fff;font-size:0.75rem;margin-top:4px;">
                Status: <span class="${data.question.status === 'answered' ? 'status-answered' : 'status-unanswered'}">${data.question.status.charAt(0).toUpperCase() + data.question.status.slice(1)}</span>
                &nbsp;|&nbsp;
                ${data.question.nickname ? `by ${data.question.nickname} &nbsp;|&nbsp;` : ''}
                ${new Date(data.question.timestamp).toLocaleString()}
            </div>
            ${data.question.responder_answer ? `<div style='margin-top:12px;background:#333;padding:10px;border-radius:6px;color:#fff;font-size:0.85rem;'><b>Official Answer:</b><br>${data.question.responder_answer}</div>` : ''}
            <div id="questionAnswerBox" style="display:none;margin-top:12px;">
                <textarea id="questionAnswerInput" placeholder="Type your answer..." style="width:100%;min-height:60px;background:#000;border:1px solid #333;color:#fff;padding:8px;font-size:0.85rem;"></textarea><br>
                <button onclick="submitQuestionAnswer()" class="admin-btn" style="background:transparent;border:1px solid #fff;color:#fff;padding:8px 16px;font-size:0.85rem;cursor:pointer;margin-top:8px;">Submit Answer</button>
                <button onclick="hideQuestionAnswerBox()" class="admin-btn" style="background:transparent;border:1px solid #fff;color:#fff;padding:8px 16px;font-size:0.85rem;cursor:pointer;margin-top:8px;margin-left:8px;">Cancel</button>
            </div>
        </div>`;
        document.getElementById('questionBlock').innerHTML = questionHtml;
        
        // Render replies
        renderReplies(data.replies || []);
    }
    
    function renderReplies(replies) {
        const repliesList = document.getElementById('repliesList');
        if (replies.length === 0) {
            repliesList.innerHTML = '<div style="color:#888;font-size:0.85rem;">No replies yet.</div>';
            return;
        }
        
        let repliesHtml = '';
        replies.forEach(reply => {
            repliesHtml += `<div class="reply" style="position:relative;">
                <div style="font-size:0.85rem;color:#fff;">${reply.reply_text}</div>
                <div style="color:#fff;font-size:0.75rem;margin-top:4px;">
                    ${new Date(reply.timestamp).toLocaleString()}
                    ${reply.edited ? '<span class="edited-label">(edited)</span>' : ''}
                </div>
                ${reply.admin_reply ? `<div style='margin-top:8px;background:#333;padding:8px;border-radius:4px;color:#fff;font-size:0.8rem;'><b>Official Answer:</b><br>${reply.admin_reply.admin_answer}</div>` : ''}
                <div style="position:absolute;top:8px;right:8px;">
                    <button onclick="showReplyAnswerBox(${reply.id})" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;" onmouseover="this.style.color='#8bb3ff'" onmouseout="this.style.color='#fff'">+</button>
                </div>
                <div id="replyAnswerBox${reply.id}" style="display:none;margin-top:12px;">
                    <textarea id="replyAnswerInput${reply.id}" placeholder="Type your answer..." style="width:100%;min-height:60px;background:#000;border:1px solid #333;color:#fff;padding:8px;font-size:0.85rem;"></textarea><br>
                    <button onclick="submitReplyAnswer(${reply.id})" class="admin-btn" style="background:transparent;border:1px solid #fff;color:#fff;padding:8px 16px;font-size:0.85rem;cursor:pointer;margin-top:8px;">Submit Answer</button>
                    <button onclick="hideReplyAnswerBox(${reply.id})" class="admin-btn" style="background:transparent;border:1px solid #fff;color:#fff;padding:8px 16px;font-size:0.85rem;cursor:pointer;margin-top:8px;margin-left:8px;">Cancel</button>
                </div>
            </div>`;
        });
        repliesList.innerHTML = repliesHtml;
    }
    fetchThread();
    // --- Question answer functions ---
    function showQuestionAnswerBox() {
        const token = document.getElementById('adminTokenInput').value.trim();
        if (!token) {
            document.getElementById('adminStatus').textContent = 'Admin token required to answer questions.';
            return;
        }
        document.getElementById('questionAnswerBox').style.display = 'block';
    }
    window.showQuestionAnswerBox = showQuestionAnswerBox;
    
    function hideQuestionAnswerBox() {
        document.getElementById('questionAnswerBox').style.display = 'none';
        document.getElementById('questionAnswerInput').value = '';
    }
    window.hideQuestionAnswerBox = hideQuestionAnswerBox;
    
    async function submitQuestionAnswer() {
        const answer = document.getElementById('questionAnswerInput').value.trim();
        const token = document.getElementById('adminTokenInput').value.trim();
        const statusDiv = document.getElementById('adminStatus');
        
        if (!answer) {
            statusDiv.textContent = 'Please enter an answer.';
            return;
        }
        
        try {
            const res = await fetch(`https://personalwebsite-xzmk.onrender.com/questions/${qid}/answer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify({ responder_answer: answer })
            });
            
            if (!res.ok) throw new Error('Failed to submit answer.');
            
            statusDiv.style.color = '#090';
            statusDiv.textContent = 'Answer submitted!';
            
            // Hide the answer box and clear the input
            hideQuestionAnswerBox();
            
            // Refresh the thread to show the new answer
            fetchThread();
        } catch (err) {
            statusDiv.style.color = '#c00';
            statusDiv.textContent = 'Error: ' + err.message;
        }
    }
    window.submitQuestionAnswer = submitQuestionAnswer;
    async function deleteThread() {
        const token = document.getElementById('adminTokenInput').value.trim();
        const statusDiv = document.getElementById('adminStatus');
        if (!token) {
            statusDiv.textContent = 'Admin token required.';
            return;
        }
        if (!confirm('Are you sure you want to delete this thread?')) return;
        try {
            const res = await fetch(`https://personalwebsite-xzmk.onrender.com/questions/${qid}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': token }
            });
            if (!res.ok) throw new Error('Failed to delete thread.');
            window.location = 'forum.html';
        } catch (err) {
            statusDiv.textContent = 'Error: ' + err.message;
        }
    }
    window.deleteThread = deleteThread;
    

    
    // --- Modal functions ---
    function openAddReplyModal() {
        document.getElementById('addReplyModal').style.display = 'flex';
    }
    window.openAddReplyModal = openAddReplyModal;
    
    function closeAddReplyModal() {
        document.getElementById('addReplyModal').style.display = 'none';
        document.getElementById('modalReplyInput').value = '';
        document.getElementById('modalReplyStatus').textContent = '';
    }
    window.closeAddReplyModal = closeAddReplyModal;
    
    // Handle modal form submission
    document.getElementById('modalReplyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const replyText = document.getElementById('modalReplyInput').value.trim();
        const statusDiv = document.getElementById('modalReplyStatus');
        
        if (!replyText) {
            statusDiv.textContent = 'Please enter a reply.';
            return;
        }
        
        submitReplyFromModal(replyText);
    });
    
    async function submitReplyFromModal(replyText) {
        const statusDiv = document.getElementById('modalReplyStatus');
        
        try {
            const res = await fetch(`https://personalwebsite-xzmk.onrender.com/questions/${qid}/replies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reply_text: replyText })
            });
            
            if (!res.ok) throw new Error('Failed to submit reply.');
            
            statusDiv.style.color = '#090';
            statusDiv.textContent = 'Reply submitted!';
            document.getElementById('modalReplyInput').value = '';
            
            // Close modal and refresh the thread
            setTimeout(() => {
                closeAddReplyModal();
                fetchThread();
            }, 1000);
        } catch (err) {
            statusDiv.style.color = '#c00';
            statusDiv.textContent = 'Error: ' + err.message;
        }
    }
    
    function showReplyAnswerBox(replyId) {
        const token = document.getElementById('adminTokenInput').value.trim();
        if (!token) {
            document.getElementById('adminStatus').textContent = 'Admin token required to answer replies.';
            return;
        }
        document.getElementById(`replyAnswerBox${replyId}`).style.display = 'block';
    }
    window.showReplyAnswerBox = showReplyAnswerBox;
    
    function hideReplyAnswerBox(replyId) {
        document.getElementById(`replyAnswerBox${replyId}`).style.display = 'none';
        document.getElementById(`replyAnswerInput${replyId}`).value = '';
    }
    window.hideReplyAnswerBox = hideReplyAnswerBox;
    
    async function submitReplyAnswer(replyId) {
        const answer = document.getElementById(`replyAnswerInput${replyId}`).value.trim();
        const token = document.getElementById('adminTokenInput').value.trim();
        const statusDiv = document.getElementById('adminStatus');
        
        if (!answer) {
            statusDiv.textContent = 'Please enter an answer.';
            return;
        }
        
        try {
            const res = await fetch(`https://personalwebsite-xzmk.onrender.com/replies/${replyId}/admin_answer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify({ admin_answer: answer })
            });
            
            if (!res.ok) throw new Error('Failed to submit reply answer.');
            
            statusDiv.style.color = '#090';
            statusDiv.textContent = 'Reply answer submitted!';
            
            // Hide the answer box and clear the input
            hideReplyAnswerBox(replyId);
            
            // Refresh the thread to show the new admin reply
            fetchThread();
        } catch (err) {
            statusDiv.style.color = '#c00';
            statusDiv.textContent = 'Error: ' + err.message;
        }
    }
    window.submitReplyAnswer = submitReplyAnswer;
    
    // --- BEGIN: Wake up backend on page load ---
    (function wakeBackend() {
        // This fetches a harmless endpoint to wake up the Render backend/database
        // It runs in the background and does not block UI or affect state
        fetch('https://personalwebsite-xzmk.onrender.com/ping').catch(() => {});
    })();
    // --- END: Wake up backend on page load ---
    </script>
</body>
</html>
