<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — Aryaman Khandelwal</title>
<link rel="icon" type="image/x-icon" href="images/header.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Yrsa:wght@400;500;600&family=Google+Sans+Code:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Updated: $(date +%s) */
  :root {
    --bg: #f6f6f6; /* very light grey */
    --text: #111111;
    --muted: #999999;
    --accent: #5e96f7; /* site blue */
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  /* Layout */
  .page {
    display: flex;
    min-height: 100dvh;
  }
  .sidebar {
    width: 10vw;              /* ~10% of viewport width */
    min-width: 120px;         /* prevent being too narrow on mid screens */
    max-width: 180px;         /* keep tidy on ultra-wide */
    padding: 48px 16px 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0; /* remove spacing between children */
    position: sticky;
    top: 0;
    height: 100dvh;
    box-sizing: border-box;
  }
  .name { 
    font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; 
    font-weight: 700;
    font-size: clamp(16px, 1.2vw + 8px, 20px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.1;
    color: var(--text);
    white-space: pre-line; /* honor line break */
    margin: 0; /* remove bottom spacing */
  }
  .name a { color: inherit; text-decoration: none; border-bottom: none; transition: color .2s ease; }
  .name a:hover, .name a:focus-visible { color: var(--accent); border-bottom: none; }

  .clock { 
    font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; 
    font-style: normal;
    font-weight: 700; /* match name weight */
    font-size: clamp(16px, 1.2vw + 8px, 20px); /* match name size */
    letter-spacing: 0.02em; /* match tracking */
    line-height: 1.1; /* match line height */
    margin: 0; /* no top spacing */
  }

  /* Desktop nav under clock */
  .nav { font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; 
    margin-top: 10px;
    
  }
  .nav a {
    font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;    
    display: block;
    font-size: clamp(11px, 0.8vw + 1px, 14px); /* slightly larger on desktop */
    color: var(--text);
    text-decoration: none;
    border-bottom: none; /* override global anchor underline */
    padding: 2px 0; /* tighter spacing */
    line-height: 1.1; /* tighter line height */
    transition: color .2s ease;
  }
  .nav a:hover, .nav a:focus-visible {
    color: var(--accent);
  }

  /* Mobile menu toggle */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 1001;
    
    font-size: 28px;
    line-height: 1;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    padding: 72px 24px 24px 24px;
    z-index: 1000;
    box-sizing: border-box;
  }
  .mobile-menu a { 
    font-family: 'Yrsa', Georgia, 'Times New Roman', serif; 
    display: block;
    
    font-size: 14px; /* smaller on mobile */
    color: var(--text);
    text-decoration: none;
    border-bottom: none; /* override global */
    padding: 6px 0; /* tighter */
    line-height: 1.1;
  }
  .mobile-menu a:hover, .mobile-menu a:focus-visible { color: var(--accent); }

  .menu-open .mobile-menu { display: block; }

  .content {
    flex: 0.8;
    padding: 40px 6vw 80px 9vw; /* increase left padding further to shift right */
    box-sizing: border-box;
  }

  /* Mobile adjustments */
  @media (max-width: 768px) {
    .page { flex-direction: column; }
    .sidebar {
      width: 100%;
      max-width: none;
      min-width: 0;
      height: auto;
      position: relative;
      padding: 24px 20px 0 20px;
      gap: 0;
    }
    .menu-toggle { display: block; }
    .nav { 
      font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;  
      display: none; 
    }
    .content { padding: 20px; }
    .name { 
      font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;  
      font-size: 14px; 
      letter-spacing: 0.04em; 
      line-height: 1.15; 
      margin: 0; 
    }
    .clock { 
      font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;  
      font-style: normal; 
      font-size: 14px; 
      letter-spacing: 0.04em; 
      line-height: 1.15; 
      margin: 0; 
    }
  }
</style>
</head>
<body>
  <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">+</button>
  <div class="page">
    <aside class="sidebar" aria-label="Site identity">
      <div class="name"><a href="/index.html">ARYAMAN
KHANDELWAL</a></div>
      <div class="clock" id="dubai-clock" aria-label="Local time (Dubai, 24h)">17:00:00</div>
      <nav class="nav" aria-label="Primary">
        <a href="/blog.html">Blog</a>
        <a href="/forum.html">Jester's Courtyard</a>
        <a href="/builds.html">Builds</a>
        <a href="/tracker.html">Tracker</a>
      </nav>
    </aside>
    <main class="content" id="main-content">
      <!-- Blank content area -->
    </main>
  </div>

  <div class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" hidden>
    <a href="/blog.html">Blog</a>
    <a href="/forum.html">Jester's Courtyard</a>
    <a href="/builds.html">Builds</a>
    <a href="/tracker.html">Tracker</a>
  </div>

  <script>
    (function() {
      // Dubai clock
      const el = document.getElementById('dubai-clock');
      if (el) {
        const fmt = new Intl.DateTimeFormat('en-GB', { 
          timeZone: 'Asia/Dubai', 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit', 
          hour12: false 
        });
        function update() {
          const parts = fmt.formatToParts(new Date());
          let hh = '00', mm = '00', ss = '00';
          for (const p of parts) { 
            if (p.type === 'hour') hh = p.value; 
            if (p.type === 'minute') mm = p.value; 
            if (p.type === 'second') ss = p.value; 
          }
          el.textContent = `${hh}:${mm}:${ss}`;
        }
        update();
        setInterval(update, 1000);
      }

      // Mobile menu toggle
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('mobile-menu');
      function openMenu() {
        document.body.classList.add('menu-open');
        toggle.textContent = '×';
        toggle.setAttribute('aria-label', 'Close menu');
        toggle.setAttribute('aria-expanded', 'true');
        menu.hidden = false;
      }
      function closeMenu() {
        document.body.classList.remove('menu-open');
        toggle.textContent = '+';
        toggle.setAttribute('aria-label', 'Open menu');
        toggle.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      }
      if (toggle && menu) {
        toggle.addEventListener('click', function() {
          if (document.body.classList.contains('menu-open')) closeMenu(); else openMenu();
        });

        // Close on link click
        menu.addEventListener('click', function(e) { 
          if (e.target.tagName === 'A') closeMenu(); 
        });
      }
    })();
  </script>
</body>
</html>
