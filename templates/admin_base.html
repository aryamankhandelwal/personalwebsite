<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} — Aryaman Khandelwal</title>
    <link rel="icon" type="image/png" href="/admin/favicon.png">
    <style>
        @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Geist Mono'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }

        :root {
            --background: #1a1a1a;
            --foreground: #ededed;
            --muted: #888888;
            --border: rgba(255,255,255,0.10);
            --card: #232323;
            --blue: #5e96f7;
        }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 40px 24px 80px 24px;
            box-sizing: border-box;
        }
        .top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .label {
            font-weight: 600;
            font-size: clamp(20px, 2.4vw, 28px);
            letter-spacing: -0.02em;
            margin: 0;
        }
        .logout-form { margin: 0; }
        .logout-form button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }
        .logout-form button:hover { color: var(--foreground); }
        .desc {
            font-size: clamp(13px, 1vw, 15px);
            color: var(--muted);
            margin: 0 0 20px 0;
        }
        .tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid var(--border);
            margin: 0 0 28px 0;
        }
        .tab {
            display: inline-block;
            padding: 0 0 10px 0;
            margin-bottom: -1px;
            border-bottom: 1px solid transparent;
            color: var(--muted);
            font-size: 14px;
            text-decoration: none;
            transition: color .2s ease, border-color .2s ease;
        }
        .tab:hover { color: var(--foreground); }
        .tab.active {
            color: var(--foreground);
            border-bottom-color: var(--foreground);
        }
        .banner {
            background: var(--card);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--foreground);
            border-left: 2px solid var(--blue);
        }
        h2 {
            font-weight: 600;
            font-size: clamp(18px, 1.6vw, 22px);
            letter-spacing: -0.01em;
            margin: 32px 0 12px 0;
        }
        h2:first-of-type { margin-top: 0; }
        h3 {
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 20px 0 10px 0;
        }
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .field input[type="text"],
        .field input[type="url"],
        .field textarea,
        .field select {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: clamp(14px, 1.1vw, 16px);
            padding: 6px 0;
            outline: none;
            resize: vertical;
        }
        .field input::placeholder,
        .field textarea::placeholder { color: var(--muted); }
        .field input:focus,
        .field textarea:focus,
        .field select:focus { border-bottom-color: var(--muted); }
        .field textarea { min-height: 60px; }
        .field select {
            -webkit-appearance: none;
            appearance: none;
        }
        .field select option {
            background: var(--card);
            color: var(--foreground);
        }
        .field-row { display: flex; gap: 16px; }
        .field-row .field { flex: 1; }
        .checks {
            display: flex;
            gap: 24px;
            margin: 12px 0 16px 0;
            font-size: 14px;
        }
        .checks label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--foreground);
            cursor: pointer;
        }
        .submit-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all .2s ease;
        }
        .submit-btn:hover {
            background: var(--foreground);
            color: var(--background);
        }
        .sector-block { margin-bottom: 20px; }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }
        .row.featured { border-left: 2px solid var(--blue); }
        .row.archived { opacity: 0.45; }
        .row-info {
            font-size: clamp(14px, 1.1vw, 16px);
            line-height: 1.3;
            min-width: 0;
        }
        .row-info .name { font-weight: 500; }
        .row-info .meta {
            font-family: 'Geist Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }
        .row-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: 12px; align-items: center; }
        .row-actions form { margin: 0; }
        .row-actions button,
        .row-actions .row-edit {
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s ease;
            text-decoration: none;
            line-height: 1.4;
        }
        .row-actions button:hover,
        .row-actions .row-edit:hover {
            border-color: var(--muted);
            background: var(--foreground);
            color: var(--background);
        }
        .empty {
            font-size: 14px;
            color: var(--muted);
            font-style: italic;
        }
        .hint {
            font-family: 'Geist Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        /* Live tweet composer */
        .compose-card { padding: 22px 22px 18px 22px; }
        .compose-card .field { margin-bottom: 16px; }
        .field textarea.compose-box {
            width: 100%;
            box-sizing: border-box;
            min-height: 320px;
            background: #1c1c1c;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: clamp(15px, 1.2vw, 17px);
            line-height: 1.65;
            padding: 16px;
            outline: none;
            resize: vertical;
        }
        .field textarea.compose-box:focus { border-color: var(--muted); }
        .compose-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 640px) {
            .field-row { flex-direction: column; gap: 0; }
            .field textarea.compose-box { min-height: 220px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <p class="label">Admin</p>
            <form class="logout-form" method="post" action="/admin/logout">
                <button type="submit">Log out</button>
            </form>
        </div>
        <p class="desc">{% block desc %}{% endblock %}</p>

        <nav class="tabs">
            <a class="tab {% if tab == 'tweets' %}active{% endif %}" href="/admin">Live tweets</a>
            <a class="tab {% if tab == 'tracker' %}active{% endif %}" href="/admin/tracker">Tracker</a>
        </nav>

        {% if banner %}
        <div class="banner">{{ banner }}</div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
