<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Aryaman Khandelwal</title>
    <link rel="icon" type="image/x-icon" href="/static/header.png">
    <style>
        @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

        :root {
            --background: #1a1a1a;
            --foreground: #ededed;
            --muted: #888888;
            --border: rgba(255,255,255,0.10);
            --card: #232323;
            --blue: #5e96f7;
        }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .wrap {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 360px;
        }
        .label {
            font-weight: 600;
            font-size: clamp(20px, 2.4vw, 28px);
            letter-spacing: -0.02em;
            margin: 0 0 4px 0;
        }
        .desc {
            font-size: clamp(13px, 1vw, 15px);
            color: var(--muted);
            margin: 0 0 20px 0;
        }
        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--border);
            margin: 0 0 20px 0;
        }
        form { margin: 0; }
        .error {
            font-size: 13px;
            color: #ef4444;
            min-height: 18px;
            margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: clamp(15px, 1.1vw, 16px);
            line-height: 1.6;
            padding: 8px 0;
            outline: none;
        }
        input[type="password"]::placeholder { color: var(--muted); }
        input[type="password"]:focus { border-bottom-color: var(--muted); }
        button {
            margin-top: 16px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all .2s ease;
        }
        button:hover {
            background: var(--foreground);
            color: var(--background);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <p class="label">Admin</p>
            <p class="desc">Enter password to continue.</p>
            <div class="divider"></div>
            <form method="post" action="/admin/login">
                <div class="error">{% if error %}{{ error }}{% endif %}</div>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
                <button type="submit">Enter</button>
            </form>
        </div>
    </div>
</body>
</html>
