<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Aryaman Khandelwal</title>
    <link rel="icon" type="image/x-icon" href="/static/header.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Yrsa:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f6f6;
            --text: #111111;
            --muted: #999999;
            --accent: #5e96f7;
            --card-bg: #e8e8e8;
        }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .wrap {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 360px;
        }
        .label {
            font-family: 'Roboto', system-ui, sans-serif;
            font-weight: 700;
            font-size: clamp(20px, 2.4vw, 28px);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin: 0 0 4px 0;
        }
        .desc {
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(12px, 0.9vw, 14px);
            color: var(--muted);
            margin: 0 0 20px 0;
        }
        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--muted);
            opacity: 0.5;
            margin: 0 0 20px 0;
        }
        form { margin: 0; }
        .error {
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            color: #c00;
            min-height: 18px;
            margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--muted);
            color: var(--text);
            font-family: 'Yrsa', Georgia, serif;
            font-size: clamp(15px, 1.3vw, 18px);
            line-height: 1.5;
            padding: 8px 0;
            outline: none;
        }
        input[type="password"]:focus { border-bottom-color: var(--accent); }
        button {
            margin-top: 16px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            cursor: pointer;
            transition: all .2s ease;
        }
        button:hover {
            background: var(--text);
            color: var(--bg);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <p class="label">Admin</p>
            <p class="desc">Enter password to continue.</p>
            <div class="divider"></div>
            <form method="post" action="/admin/login">
                <div class="error">{% if error %}{{ error }}{% endif %}</div>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
                <button type="submit">Enter</button>
            </form>
        </div>
    </div>
</body>
</html>
