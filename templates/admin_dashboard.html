{% extends "admin_base.html" %}

{% block title %}Live tweets{% endblock %}
{% block desc %}Post a live tweet.{% endblock %}

{% block content %}
<form class="form-card compose-card" method="post" action="/admin/livetweets" id="tweet-form">
    <div class="field">
        <label for="tweet-content">Content</label>
        <textarea name="content" id="tweet-content" class="compose-box" placeholder="What's on your mind?" required autofocus></textarea>
    </div>
    <div class="compose-actions">
        <button type="submit" class="submit-btn">Post</button>
        <span class="hint">&#8984;/Ctrl + Enter</span>
    </div>
</form>
<script>
document.getElementById('tweet-content').addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        if (this.value.trim()) document.getElementById('tweet-form').submit();
    }
});
</script>
{% endblock %}
