    // Dubai clock with scramble animation
    (function() {
        const el = document.getElementById('dubai-clock');
        if (!el) return;
        const fmt = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Dubai',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        let isHovered = false;
        let scrambleAnim = null;

        function getTimeStr() {
          const parts = fmt.formatToParts(new Date());
          let hh = '00', mm = '00', ss = '00';
          for (const p of parts) {
            if (p.type === 'hour') hh = p.value;
            if (p.type === 'minute') mm = p.value;
            if (p.type === 'second') ss = p.value;
          }
          return hh + ':' + mm + ':' + ss;
        }

        function scrambleTo(target, done) {
          if (scrambleAnim) cancelAnimationFrame(scrambleAnim);
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:';
          const len = Math.max(el.textContent.length, target.length);
          const padded = target.padEnd(len);
          let iter = 0;
          const maxIter = 20;
          function step() {
            let out = '';
            let settled = 0;
            for (let i = 0; i < padded.length; i++) {
              if (iter >= maxIter - (padded.length - 1 - i)) {
                out += padded[i];
                settled++;
              } else {
                out += chars[Math.floor(Math.random() * chars.length)];
              }
            }
            el.textContent = out.trimEnd();
            iter++;
            if (settled < padded.length) {
              scrambleAnim = requestAnimationFrame(step);
            } else {
              scrambleAnim = null;
              if (done) done();
            }
          }
          scrambleAnim = requestAnimationFrame(step);
        }

        function update() {
          if (!isHovered) el.textContent = getTimeStr();
        }
        update();
        setInterval(update, 1000);

        el.addEventListener('mouseenter', function() {
          isHovered = true;
          scrambleTo('DUBAI');
        });
        el.addEventListener('mouseleave', function() {
          isHovered = false;
          scrambleTo(getTimeStr(), function() { isHovered = false; });
        });
        el.style.cursor = 'default';
    })();

    // Mobile menu
    (function() {
        const toggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('mobile-menu');
        function openMenu() {
            document.body.classList.add('menu-open');
            toggle.textContent = '\u00d7';
            toggle.setAttribute('aria-label', 'Close menu');
            toggle.setAttribute('aria-expanded', 'true');
            menu.hidden = false;
        }
        function closeMenu() {
            document.body.classList.remove('menu-open');
            toggle.textContent = '+';
            toggle.setAttribute('aria-label', 'Open menu');
            toggle.setAttribute('aria-expanded', 'false');
            menu.hidden = true;
        }
        if (toggle && menu) {
            toggle.addEventListener('click', function() {
                document.body.classList.contains('menu-open') ? closeMenu() : openMenu();
            });
            menu.addEventListener('click', function(e) { if (e.target.tagName === 'A') closeMenu(); });
        }
    })();

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function formatTs(isoString) {
        const d = new Date(isoString);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            + ' at '
            + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function renderCard(tweet) {
        const card = document.createElement('div');
        card.className = 'lt-card';
        card.dataset.id = tweet.id;
        card.innerHTML =
            '<div class="lt-card-content">' + escapeHtml(tweet.content) + '</div>' +
            '<div class="lt-card-meta">' + formatTs(tweet.created_at) + '</div>';

            }

        return card;

    async function fetchPosts() {
        // if (document.querySelector('.lt-token-prompt')) return; // DELETE UI — commented out
        try {
            const res = await fetch(API_BASE + '/livetweets');
            if (!res.ok) return;
            const posts = await res.json();
            const container = document.getElementById('lt-cards');
            container.innerHTML = '';
            if (posts.length === 0) {
                container.innerHTML = '<p class="lt-empty">No posts yet.</p>';
                return;
            }
            posts.forEach(tweet => container.appendChild(renderCard(tweet)));
        } catch (_) {}
    }

    fetchPosts();
    setInterval(fetchPosts, 30000);
    fetch(API_BASE + '/ping').catch(() => {});
