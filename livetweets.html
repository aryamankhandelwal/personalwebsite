<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tweets — Aryaman Khandelwal</title>
    <link rel="icon" type="image/x-icon" href="images/header.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Yrsa:wght@400;500;600&family=Google+Sans+Code:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f6f6;
            --text: #111111;
            --muted: #999999;
            --accent: #5e96f7;
            --card-bg: #e8e8e8;
        }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            line-height: 1.3;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .page {
            display: flex;
            min-height: 100dvh;
        }
        .sidebar {
            width: 10vw;
            min-width: 120px;
            max-width: 180px;
            padding: 48px 16px 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            position: sticky;
            top: 0;
            height: 100dvh;
            box-sizing: border-box;
        }
        .name {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(16px, 1.2vw + 8px, 20px);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--text);
            white-space: pre-line;
            margin: 0;
        }
        .name a { color: inherit; text-decoration: none; border-bottom: none; transition: color .2s ease; }
        .name a:hover, .name a:focus-visible { color: var(--accent); border-bottom: none; }
        .clock {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(16px, 1.2vw + 8px, 20px);
            letter-spacing: 0.02em;
            line-height: 1.1;
            margin: 0;
        }
        .nav {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            margin-top: 10px;
        }
        .nav a {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            display: block;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            color: var(--text);
            text-decoration: none;
            border-bottom: none;
            padding: 2px 0;
            line-height: 1.1;
            transition: color .2s ease;
        }
        .nav a:hover, .nav a:focus-visible { color: var(--accent); }
        .menu-toggle {
            display: none;
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 1001;
            font-size: 28px;
            line-height: 1;
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }
        .mobile-menu {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            padding: 72px 24px 24px 24px;
            z-index: 1000;
            box-sizing: border-box;
        }
        .mobile-menu a {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            display: block;
            font-size: 14px;
            color: var(--text);
            text-decoration: none;
            border-bottom: none;
            padding: 6px 0;
            line-height: 1.1;
        }
        .mobile-menu a:hover, .mobile-menu a:focus-visible { color: var(--accent); }
        .menu-open .mobile-menu { display: block; }

        /* Layout */
        .lt-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 6vw 80px 9vw;
            box-sizing: border-box;
            min-width: 0;
        }

        /* Header — mirrors forum-header pattern */
        .lt-header { margin-bottom: 20px; max-width: 540px; }
        .lt-nav {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lt-nav .back-arrow {
            color: var(--muted);
            text-decoration: none;
            border-bottom: none;
            transition: color .2s ease;
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(20px, 2.4vw, 28px);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .lt-nav .back-arrow:hover { color: var(--accent); }
        .lt-nav .lt-label {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(20px, 2.4vw, 28px);
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .lt-description {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: clamp(12px, 0.9vw, 14px);
            line-height: 1.2;
            margin: 0 0 20px 0;
            color: var(--text);
        }
        .lt-divider {
            width: 100%;
            height: 1px;
            background-color: var(--muted);
            margin: 0 0 20px 0;
            opacity: 0.5;
        }

        /* Two-column row */
        .lt-columns {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* Feed */
        .lt-feed {
            flex: 1;
            min-width: 0;
        }
        .lt-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            transition: background-color .2s ease;
        }
        .lt-card:hover { background: #ddd; }
        .lt-card-content {
            font-family: 'Yrsa', Georgia, 'Times New Roman', serif;
            font-size: clamp(15px, 1.3vw, 18px);
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .lt-card-meta {
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(10px, 0.7vw, 12px);
            color: var(--muted);
            line-height: 1.2;
        }
        .lt-delete-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            opacity: 0;
            transition: opacity .15s;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 2px 4px;
        }
        .lt-card:hover .lt-delete-btn { opacity: 1; }
        .lt-delete-btn:hover { color: #c00; }
        .lt-token-prompt {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .lt-token-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--muted);
            color: var(--text);
            font-family: 'Yrsa', Georgia, serif;
            font-size: clamp(13px, 1vw, 15px);
            padding: 4px 0;
            outline: none;
            width: 140px;
        }
        .lt-token-input:focus { border-bottom-color: var(--accent); }
        .lt-token-confirm, .lt-token-cancel {
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            cursor: pointer;
            transition: all .2s ease;
        }
        .lt-token-confirm:hover { background: var(--text); color: var(--bg); }
        .lt-token-cancel:hover { background: var(--muted); color: var(--bg); }
        .lt-token-error {
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            color: #c00;
            width: 100%;
        }
        .lt-empty {
            font-family: 'Yrsa', Georgia, serif;
            font-size: clamp(15px, 1.3vw, 18px);
            color: var(--muted);
        }

        /* Compose panel — fixed bottom-right on desktop */
        .lt-compose {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 280px;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            z-index: 100;
        }
        #lt-input {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--muted);
            color: var(--text);
            font-family: 'Yrsa', Georgia, 'Times New Roman', serif;
            font-size: clamp(15px, 1.3vw, 18px);
            line-height: 1.5;
            padding: 8px 0;
            outline: none;
            resize: none;
            min-height: 120px;
        }
        #lt-input:focus { border-bottom-color: var(--accent); }
        #lt-error {
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            color: #c00;
            margin-top: 8px;
            min-height: 18px;
        }
        #lt-submit {
            margin-top: 12px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: clamp(11px, 0.8vw + 1px, 14px);
            cursor: not-allowed;
            transition: all .2s ease;
            opacity: 0.35;
        }
        #lt-submit:not(:disabled) {
            opacity: 1;
            cursor: pointer;
        }
        #lt-submit:not(:disabled):hover {
            background: var(--text);
            color: var(--bg);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .page { flex-direction: column; }
            .sidebar {
                width: 100%;
                max-width: none;
                min-width: 0;
                height: auto;
                position: relative;
                padding: 24px 20px 0 20px;
                gap: 0;
            }
            .menu-toggle { display: block; }
            .nav { display: none; }
            .name { font-size: 14px; letter-spacing: 0.04em; line-height: 1.15; margin: 0; }
            .clock { font-style: normal; font-size: 14px; letter-spacing: 0.04em; line-height: 1.15; margin: 0; }
            .lt-layout { padding: 20px; }
            .lt-columns {
                flex-direction: column;
                gap: 24px;
            }
            .lt-compose {
                position: static;
                width: 100%;
                background: transparent;
                border-radius: 0;
                padding: 0;
                order: -1;
            }
            .lt-feed { width: 100%; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">+</button>
    <div class="page">
        <aside class="sidebar" aria-label="Site identity">
            <div class="name"><a href="/index.html">ARYAMAN
KHANDELWAL</a></div>
            <div class="clock" id="dubai-clock" aria-label="Local time (Dubai, 24h)">17:00:00</div>
            <nav class="nav" aria-label="Primary">
                <a href="/blog.html">Blog</a>
                <a href="/forum.html">Jester's Courtyard</a>
                <a href="/builds.html">Builds</a>
                <a href="/tracker.html">Tracker</a>
                <a href="/interests.html">Interests</a>
                <a href="/livetweets.html">Live Tweets</a>
            </nav>
        </aside>
        <div class="lt-layout">
            <div class="lt-header">
                <div class="lt-nav">
                    <a href="/index.html" class="back-arrow">&lt;</a>
                    <span class="lt-label">Live Tweets</span>
                </div>
                <p class="lt-description">My live thoughts as I learn and discover the power of software after the advent of AI-assisted coding</p>
                <div class="lt-divider"></div>
            </div>
            <div class="lt-columns">
                <div class="lt-feed">
                    <div id="lt-cards"></div>
                </div>
                <div class="lt-compose">
                    <textarea id="lt-input" placeholder="What's on your mind?" rows="6"></textarea>
                    <div id="lt-error"></div>
                    <button id="lt-submit" disabled>Post</button>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" hidden>
        <a href="/blog.html">Blog</a>
        <a href="/forum.html">Jester's Courtyard</a>
        <a href="/builds.html">Builds</a>
        <a href="/tracker.html">Tracker</a>
        <a href="/interests.html">Interests</a>
        <a href="/livetweets.html">Live Tweets</a>
    </div>

    <script>
    const API_BASE = 'https://personalwebsite-xzmk.onrender.com';

    // Dubai clock
    (function() {
        const el = document.getElementById('dubai-clock');
        if (!el) return;
        const fmt = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Dubai',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        function update() {
            const parts = fmt.formatToParts(new Date());
            let hh = '00', mm = '00', ss = '00';
            for (const p of parts) {
                if (p.type === 'hour') hh = p.value;
                if (p.type === 'minute') mm = p.value;
                if (p.type === 'second') ss = p.value;
            }
            el.textContent = `${hh}:${mm}:${ss}`;
        }
        update();
        setInterval(update, 1000);
    })();

    // Mobile menu
    (function() {
        const toggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('mobile-menu');
        function openMenu() {
            document.body.classList.add('menu-open');
            toggle.textContent = '×';
            toggle.setAttribute('aria-label', 'Close menu');
            toggle.setAttribute('aria-expanded', 'true');
            menu.hidden = false;
        }
        function closeMenu() {
            document.body.classList.remove('menu-open');
            toggle.textContent = '+';
            toggle.setAttribute('aria-label', 'Open menu');
            toggle.setAttribute('aria-expanded', 'false');
            menu.hidden = true;
        }
        if (toggle && menu) {
            toggle.addEventListener('click', function() {
                document.body.classList.contains('menu-open') ? closeMenu() : openMenu();
            });
            menu.addEventListener('click', function(e) { if (e.target.tagName === 'A') closeMenu(); });
        }
    })();

    // Validation
    function validate(text) {
        if (!text.trim()) return { valid: false, error: '' };
        const lines = text.split('\n');
        const trimmedLines = lines.map(l => l.trimEnd());
        let lastNonEmpty = '';
        for (let i = trimmedLines.length - 1; i >= 0; i--) {
            if (trimmedLines[i] !== '') { lastNonEmpty = trimmedLines[i]; break; }
        }
        const hasKeyword = text.toLowerCase().includes('darkmatter');
        const lastLineIsKeyword = lastNonEmpty.toLowerCase() === 'darkmatter';
        if (!hasKeyword) return { valid: false, error: 'Missing keyword: message must end with "darkmatter" on its own line.' };
        if (!lastLineIsKeyword) return { valid: false, error: 'Keyword must be the very last line, alone, with no other text.' };
        return { valid: true, error: '' };
    }

    function stripKeyword(text) {
        const lines = text.split('\n');
        while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
        lines.pop();
        return lines.join('\n').trimEnd();
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function formatTs(isoString) {
        const d = new Date(isoString);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            + ' at '
            + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    // Compose
    const input = document.getElementById('lt-input');
    const submitBtn = document.getElementById('lt-submit');
    const errorDiv = document.getElementById('lt-error');

    input.addEventListener('input', function() {
        const { valid } = validate(this.value);
        submitBtn.disabled = !valid;
        errorDiv.textContent = '';
    });

    input.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
            e.preventDefault();
            if (!submitBtn.disabled) submitPost();
        }
    });

    submitBtn.addEventListener('click', submitPost);

    async function submitPost() {
        const raw = input.value;
        const { valid } = validate(raw);
        if (!valid) return;
        const content = stripKeyword(raw);
        submitBtn.disabled = true;
        try {
            const res = await fetch(API_BASE + '/livetweets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            if (!res.ok) throw new Error();
            input.value = '';
            errorDiv.textContent = '';
            fetchPosts();
        } catch (_) {
            errorDiv.textContent = 'Could not post.';
            submitBtn.disabled = false;
        }
    }

    // Delete
    async function deletePost(id, cardEl, token) {
        const res = await fetch(API_BASE + '/livetweets/' + id, {
            method: 'DELETE',
            headers: { 'x-admin-token': token }
        });
        if (res.ok) {
            sessionStorage.setItem('lt_token', token);
            cardEl.remove();
            return true;
        }
        return false;
    }

    function showTokenPrompt(cardEl, id) {
        const existing = cardEl.querySelector('.lt-token-prompt');
        if (existing) { existing.remove(); return; }

        const prompt = document.createElement('div');
        prompt.className = 'lt-token-prompt';
        prompt.innerHTML =
            '<input class="lt-token-input" type="password" placeholder="Token..." autocomplete="off">' +
            '<button class="lt-token-confirm">Delete</button>' +
            '<button class="lt-token-cancel">Cancel</button>' +
            '<span class="lt-token-error"></span>';
        cardEl.appendChild(prompt);

        const tokenInput = prompt.querySelector('.lt-token-input');
        const confirmBtn = prompt.querySelector('.lt-token-confirm');
        const cancelBtn = prompt.querySelector('.lt-token-cancel');
        const tokenError = prompt.querySelector('.lt-token-error');

        tokenInput.focus();
        cancelBtn.addEventListener('click', () => prompt.remove());

        async function tryDelete() {
            const token = tokenInput.value.trim();
            if (!token) return;
            const ok = await deletePost(id, cardEl, token);
            if (!ok) {
                tokenError.textContent = 'Wrong token.';
                tokenInput.value = '';
                tokenInput.focus();
            }
        }

        confirmBtn.addEventListener('click', tryDelete);
        tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryDelete(); });
    }

    function renderCard(tweet) {
        const card = document.createElement('div');
        card.className = 'lt-card';
        card.dataset.id = tweet.id;
        card.innerHTML =
            '<div class="lt-card-content">' + escapeHtml(tweet.content) + '</div>' +
            '<div class="lt-card-meta">' + formatTs(tweet.created_at) + '</div>' +
            '<button class="lt-delete-btn" aria-label="Delete post">\xd7</button>';

        card.querySelector('.lt-delete-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            const cached = sessionStorage.getItem('lt_token');
            if (cached) {
                deletePost(tweet.id, card, cached).then(ok => {
                    if (!ok) {
                        sessionStorage.removeItem('lt_token');
                        showTokenPrompt(card, tweet.id);
                    }
                });
            } else {
                showTokenPrompt(card, tweet.id);
            }
        });

        return card;
    }

    async function fetchPosts() {
        if (document.querySelector('.lt-token-prompt')) return;
        try {
            const res = await fetch(API_BASE + '/livetweets');
            if (!res.ok) return;
            const posts = await res.json();
            const container = document.getElementById('lt-cards');
            container.innerHTML = '';
            if (posts.length === 0) {
                container.innerHTML = '<p class="lt-empty">No posts yet.</p>';
                return;
            }
            posts.forEach(tweet => container.appendChild(renderCard(tweet)));
        } catch (_) {}
    }

    fetchPosts();
    setInterval(fetchPosts, 30000);
    fetch(API_BASE + '/ping').catch(() => {});
    </script>
</body>
</html>
