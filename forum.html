<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jester's Courtyard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .forum-container { max-width: 700px; margin: 40px auto; }
        .question-card { background: #333; border-radius: 8px; box-shadow: 0 2px 8px #0001; margin-bottom: 12px; padding: 12px 16px; }
        .question-card .meta { font-size: 0.75rem; color: #fff; margin-top: 4px; }
        .status-unanswered { color: #c00; }
        .status-answered { color: #090; }
        .sticky-add-btn { position: fixed; bottom: 32px; right: 32px; background: #fff; color: #000; border: none; border-radius: 50px; padding: 10px 20px; font-size: 0.85rem; cursor: pointer; box-shadow: 0 2px 8px #0002; z-index: 100; }
        .sticky-add-btn:hover { background: #000; color: #fff; border: 1px solid #fff; }
        .pagination { text-align: center; margin: 24px 0; }
        .pagination a { color: #fff !important; text-decoration: underline; font-size: 0.85rem; margin: 0 4px; }
        .pagination a:hover { color: #8bb3ff !important; }
        .pagination span { color: #fff; font-size: 0.85rem; margin: 0 2px; }
        .reply-count { color: #555; }
        .back-link {
            color: #fff !important;
            text-decoration: underline;
            font-size: 0.85rem;
        }
        .back-link:hover {
            color: #8bb3ff !important;
        }
        .modal-btn:hover {
            color: #8bb3ff !important;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html">Aryaman Khandelwal</a></div>
    </nav>
    <section class="main">
        <div class="main-container">
            <div class="blog-first" style="margin-top:2rem;">
                <div style="margin-bottom:1rem;">
                    <span style="color:#fff;font-size:0.85rem;">< </span><a href="index.html" class="back-link">Back</a>
                </div>
                <h1 style="font-size:1rem;font-weight:normal;margin-bottom:0.5em;">[Jester's Courtyard]</h1>
                <div class="forum-container" style="text-align:left;">
                    <div id="questionsList"></div>
                    <div class="pagination">
                        <span style="color:#fff;font-size:0.85rem;"><</span><a href="#" id="prevPage">Newer</a>
                        <span id="pageInfo"></span>
                        <a href="#" id="nextPage">Older</a><span style="color:#fff;font-size:0.85rem;">></span>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <button class="sticky-add-btn" onclick="openAddModal()">+ Add a question</button>
    <!-- Modal for adding question -->
    <div id="addModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0008;z-index:200;align-items:center;justify-content:center;">
        <div style="background:#000;padding:32px 24px;border-radius:10px;max-width:400px;width:90vw;border:1px solid #333;">
            <h3 style="color:#fff;font-size:0.85rem;margin-bottom:1rem;">Ask a Question</h3>
            <form id="modalQuestionForm">
                <input type="text" id="modalQuestionInput" placeholder="Your question..." required style="width:100%;padding:8px;margin-bottom:10px;background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font-size:0.85rem;outline:none;">
                <input type="text" id="modalNicknameInput" placeholder="Nickname (optional)" style="width:100%;padding:8px;margin-bottom:10px;background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font-size:0.85rem;outline:none;">
                <button type="submit" class="modal-btn" style="padding:8px 16px;background:transparent;border:none;color:#fff;font-size:0.85rem;cursor:pointer;">Submit</button>
                <button type="button" onclick="closeAddModal()" class="modal-btn" style="padding:8px 16px;margin-left:8px;background:transparent;border:none;color:#fff;font-size:0.85rem;cursor:pointer;">Cancel</button>
            </form>
            <div id="modalStatus" style="margin-top:8px;color:#c00;font-size:0.85rem;"></div>
        </div>
    </div>
    <script>
    // Typewriter Animation
    function typeWriter(element, text, speed = 100) {
        let i = 0;
        element.innerHTML = '';
        element.style.opacity = '1';
        element.style.whiteSpace = 'nowrap';
        element.style.overflow = 'hidden';
        
        function type() {
            if (i < text.length) {
                element.innerHTML = text.substring(0, i + 1) + '<span class="blinking-cursor">_</span>';
                i++;
                setTimeout(type, speed);
            } else {
                // Keep the blinking cursor after typing is complete
                element.innerHTML = text + '<span class="blinking-cursor">_</span>';
                
                // Remove the cursor after 10 seconds
                setTimeout(() => {
                    element.innerHTML = text;
                }, 10000);
            }
        }
        
        type();
    }

    // Initialize typewriter effect when page loads
    document.addEventListener('DOMContentLoaded', function() {
        const logoElement = document.querySelector('.logo a');
        if (logoElement) {
            const originalText = logoElement.textContent;
            logoElement.textContent = '';
            logoElement.style.opacity = '1';
            logoElement.style.whiteSpace = 'nowrap';
            logoElement.style.overflow = 'hidden';
            
            typeWriter(logoElement, originalText, 120); // 120ms per character for ~2 seconds total
        }
    });

    let page = 1;
    const limit = 10;
    let totalLoaded = 0;
    async function fetchQuestions() {
        const skip = (page - 1) * limit;
        const res = await fetch('https://personalwebsite-xzmk.onrender.com/questions?skip=' + skip + '&limit=' + limit);
        const questions = await res.json();
        totalLoaded = questions.length;
        const list = document.getElementById('questionsList');
        list.innerHTML = '';
        if (questions.length === 0) {
            list.innerHTML = '<p style="color:#fff;font-size:0.85rem;">No questions yet. Be the first to ask!</p>';
        }
        questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div style="font-size:0.85rem;cursor:pointer;color:#fff;" onclick="window.location='forum_question.html?id=${q.id}'">${q.text}</div>
                <div class="meta">
                    <span class="${q.status === 'answered' ? 'status-answered' : 'status-unanswered'}">${q.status.charAt(0).toUpperCase() + q.status.slice(1)}</span>
                    &nbsp;|&nbsp;
                    <span style="color:#fff;">${q.reply_count} replies</span>
                    &nbsp;|&nbsp;
                    <span>${new Date(q.timestamp).toLocaleString()}</span>
                    ${q.nickname ? `&nbsp;|&nbsp;<span>by ${q.nickname}</span>` : ''}
                </div>
            `;
            list.appendChild(card);
        });
        document.getElementById('pageInfo').textContent = `Page ${page}`;
    }
    document.getElementById('prevPage').onclick = function(e) {
        e.preventDefault();
        if (page > 1) { page--; fetchQuestions(); }
    };
    document.getElementById('nextPage').onclick = function(e) {
        e.preventDefault();
        if (totalLoaded === limit) { page++; fetchQuestions(); }
    };
    fetchQuestions();
    // Modal logic
    function openAddModal() {
        document.getElementById('addModal').style.display = 'flex';
        document.getElementById('modalStatus').textContent = '';
    }
    function closeAddModal() {
        document.getElementById('addModal').style.display = 'none';
    }
    window.openAddModal = openAddModal;
    window.closeAddModal = closeAddModal;
    document.getElementById('modalQuestionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const question = document.getElementById('modalQuestionInput').value.trim();
        const nickname = document.getElementById('modalNicknameInput').value.trim();
        const statusDiv = document.getElementById('modalStatus');
        statusDiv.textContent = '';
        if (!question) {
            statusDiv.textContent = 'Please enter a question.';
            return;
        }
        try {
            const res = await fetch('https://personalwebsite-xzmk.onrender.com/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: question, nickname: nickname || null })
            });
            if (!res.ok) throw new Error('Failed to submit question.');
            document.getElementById('modalQuestionInput').value = '';
            document.getElementById('modalNicknameInput').value = '';
            statusDiv.style.color = '#090';
            statusDiv.textContent = 'Question submitted!';
            setTimeout(() => { closeAddModal(); fetchQuestions(); }, 1000);
        } catch (err) {
            statusDiv.style.color = '#c00';
            statusDiv.textContent = 'Error: ' + err.message;
        }
    });
    // --- BEGIN: Wake up backend on page load ---
    (function wakeBackend() {
        // This fetches a harmless endpoint to wake up the Render backend/database
        // It runs in the background and does not block UI or affect state
        fetch('https://personalwebsite-xzmk.onrender.com/ping').catch(() => {});
    })();
    // --- END: Wake up backend on page load ---
    </script>
</body>
</html>
