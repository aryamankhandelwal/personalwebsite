<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jester's Courtyard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .forum-container { max-width: 700px; margin: 40px auto; }
        .question-card { background: #f8f8ff; border-radius: 8px; box-shadow: 0 2px 8px #0001; margin-bottom: 18px; padding: 18px 22px; }
        .question-card .meta { font-size: 0.95em; color: #666; margin-top: 6px; }
        .status-unanswered { color: #c00; font-weight: bold; }
        .status-answered { color: #090; font-weight: bold; }
        .sticky-add-btn { position: fixed; bottom: 32px; right: 32px; background: #6699cc; color: #fff; border: none; border-radius: 50px; padding: 16px 28px; font-size: 1.1em; cursor: pointer; box-shadow: 0 2px 8px #0002; z-index: 100; }
        .sticky-add-btn:hover { background: #336699; }
        .pagination { text-align: center; margin: 24px 0; }
        .pagination button { margin: 0 6px; padding: 6px 14px; }
        .reply-count { color: #555; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html">Khandelwal</a></div>
    </nav>
    <div class="forum-container" style="text-align:left;">
        <h2>Jester's Courtyard</h2>
        <div id="questionsList"></div>
        <div class="pagination">
            <button id="prevPage">Previous</button>
            <span id="pageInfo"></span>
            <button id="nextPage">Next</button>
        </div>
    </div>
    <button class="sticky-add-btn" onclick="openAddModal()">Add a question</button>
    <!-- Modal for adding question -->
    <div id="addModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0008;z-index:200;align-items:center;justify-content:center;">
        <div style="background:#fff;padding:32px 24px;border-radius:10px;max-width:400px;width:90vw;">
            <h3>Ask a Question</h3>
            <form id="modalQuestionForm">
                <input type="text" id="modalQuestionInput" placeholder="Your question..." required style="width:100%;padding:8px;margin-bottom:10px;">
                <input type="text" id="modalNicknameInput" placeholder="Nickname (optional)" style="width:100%;padding:8px;margin-bottom:10px;">
                <button type="submit" style="padding:8px 16px;">Submit</button>
                <button type="button" onclick="closeAddModal()" style="padding:8px 16px;margin-left:8px;">Cancel</button>
            </form>
            <div id="modalStatus" style="margin-top:8px;color:#c00;"></div>
        </div>
    </div>
    <script>
    let page = 1;
    const limit = 10;
    let totalLoaded = 0;
    async function fetchQuestions() {
        const skip = (page - 1) * limit;
        const res = await fetch('https://personalwebsite-xzmk.onrender.com/questions?skip=' + skip + '&limit=' + limit);
        const questions = await res.json();
        totalLoaded = questions.length;
        const list = document.getElementById('questionsList');
        list.innerHTML = '';
        if (questions.length === 0) {
            list.innerHTML = '<p>No questions yet. Be the first to ask!</p>';
        }
        questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div style="font-weight:bold;font-size:1.1em;cursor:pointer;" onclick="window.location='forum_question.html?id=${q.id}'">${q.text}</div>
                <div class="meta">
                    <span class="${q.status === 'answered' ? 'status-answered' : 'status-unanswered'}">${q.status.charAt(0).toUpperCase() + q.status.slice(1)}</span>
                    &nbsp;|&nbsp;
                    <span class="reply-count">${q.reply_count} replies</span>
                    &nbsp;|&nbsp;
                    <span>${new Date(q.timestamp).toLocaleString()}</span>
                    ${q.nickname ? `&nbsp;|&nbsp;<span>by ${q.nickname}</span>` : ''}
                </div>
            `;
            list.appendChild(card);
        });
        document.getElementById('pageInfo').textContent = `Page ${page}`;
    }
    document.getElementById('prevPage').onclick = function() {
        if (page > 1) { page--; fetchQuestions(); }
    };
    document.getElementById('nextPage').onclick = function() {
        if (totalLoaded === limit) { page++; fetchQuestions(); }
    };
    fetchQuestions();
    // Modal logic
    function openAddModal() {
        document.getElementById('addModal').style.display = 'flex';
        document.getElementById('modalStatus').textContent = '';
    }
    function closeAddModal() {
        document.getElementById('addModal').style.display = 'none';
    }
    window.openAddModal = openAddModal;
    window.closeAddModal = closeAddModal;
    document.getElementById('modalQuestionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const question = document.getElementById('modalQuestionInput').value.trim();
        const nickname = document.getElementById('modalNicknameInput').value.trim();
        const statusDiv = document.getElementById('modalStatus');
        statusDiv.textContent = '';
        if (!question) {
            statusDiv.textContent = 'Please enter a question.';
            return;
        }
        try {
            const res = await fetch('https://personalwebsite-xzmk.onrender.com/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: question, nickname: nickname || null })
            });
            if (!res.ok) throw new Error('Failed to submit question.');
            document.getElementById('modalQuestionInput').value = '';
            document.getElementById('modalNicknameInput').value = '';
            statusDiv.style.color = '#090';
            statusDiv.textContent = 'Question submitted!';
            setTimeout(() => { closeAddModal(); fetchQuestions(); }, 1000);
        } catch (err) {
            statusDiv.style.color = '#c00';
            statusDiv.textContent = 'Error: ' + err.message;
        }
    });
    // --- BEGIN: Wake up backend on page load ---
    (function wakeBackend() {
        // This fetches a harmless endpoint to wake up the Render backend/database
        // It runs in the background and does not block UI or affect state
        fetch('https://personalwebsite-xzmk.onrender.com/ping').catch(() => {});
    })();
    // --- END: Wake up backend on page load ---
    </script>
</body>
</html>
