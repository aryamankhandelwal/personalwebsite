<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog – Aryaman Khandelwal</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png"><style>
  @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Geist'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Geist Mono'; src: url('https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }

  :root {
    --background: #1a1a1a; --foreground: #ededed; --muted: #888888;
    --muted-foreground: #a1a1a1; --border: rgba(255,255,255,0.10);
    --card: #232323; --blue: #5e96f7;
  }

  a { color: inherit; text-decoration: none; border-bottom: none; }
  html { scrollbar-gutter: stable; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--background); color: var(--foreground);
    font-family: 'Geist', system-ui, sans-serif; line-height: 1.6;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  .page { display: flex; min-height: 100dvh; }
  .sidebar {
    width: 10vw; min-width: 120px; max-width: 180px;
    padding: 48px 16px 24px 16px; display: flex; flex-direction: column;
    align-items: flex-start; gap: 0; position: sticky; top: 0;
    height: 100dvh; box-sizing: border-box;
  }
  .name {
    font-family: 'Geist', system-ui, sans-serif; font-weight: 600;
    font-size: clamp(14px, 1vw, 16px); letter-spacing: 0.04em;
    text-transform: uppercase; line-height: 1.2; color: var(--foreground);
    white-space: pre-line; margin: 0;
  }
  .name a { color: inherit; text-decoration: none; border-bottom: none; transition: color .2s ease; }
  .name a:hover, .name a:focus-visible { color: var(--blue); border-bottom: none; }

  .clock {
    font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 400;
    font-size: clamp(13px, 0.9vw, 15px); letter-spacing: 0.04em; color: #9a9a9a;
    font-variant-numeric: tabular-nums; font-feature-settings: 'zero' 1;
    line-height: 1.2; margin: 0;
  }

  .nav { font-family: 'Geist', system-ui, sans-serif; margin-top: 14px; }
  .nav a {
    font-family: 'Geist', system-ui, sans-serif; display: block;
    font-size: clamp(12px, 0.85vw, 14px); color: var(--muted);
    text-decoration: none; border-bottom: none; padding: 3px 0;
    line-height: 1.2; transition: color .2s ease;
  }
  .nav a:hover, .nav a:focus-visible { color: var(--blue); }

  .menu-toggle {
    display: none; position: fixed; top: 10px; right: 12px; z-index: 1001;
    font-family: 'Geist', system-ui, sans-serif; font-size: 28px; line-height: 1;
    width: 36px; height: 36px; border: none; background: transparent;
    color: var(--foreground); cursor: pointer;
  }
  .mobile-menu {
    display: none; position: fixed; inset: 0; background: var(--background);
    padding: 72px 24px 24px 24px; z-index: 1000; box-sizing: border-box;
  }
  .mobile-menu a {
    font-family: 'Geist', system-ui, sans-serif; display: block; font-size: 14px;
    color: var(--muted); text-decoration: none; border-bottom: none;
    padding: 6px 0; line-height: 1.1;
  }
  .mobile-menu a:hover, .mobile-menu a:focus-visible { color: var(--blue); }
  .menu-open .mobile-menu { display: block; }

  .content { flex: 0.8; padding: 40px 6vw 80px 9vw; box-sizing: border-box; }
  .section { font-family: 'Geist', system-ui, sans-serif; max-width: 540px; }

  .blog-header { margin-bottom: 20px; }
  .blog-nav { margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  .blog-nav .back-arrow {
    color: var(--muted); text-decoration: none; border-bottom: none;
    transition: color .2s ease; font-family: 'Geist', system-ui, sans-serif;
    font-weight: 600; font-size: clamp(20px, 2.4vw, 28px);
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .blog-nav .back-arrow:hover { color: var(--blue); }
  .blog-nav .blog-label {
    font-family: 'Geist', system-ui, sans-serif; font-weight: 500;
    font-size: clamp(20px, 2.4vw, 28px); color: var(--foreground);
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .section .blog-title {
    font-family: 'Geist', system-ui, sans-serif !important;
    font-weight: 400 !important;
    font-size: clamp(12px, 0.85vw, 14px) !important;
    line-height: 1.6 !important;
    margin: 0 0 20px 0 !important;
    letter-spacing: 0 !important;
    color: var(--muted-foreground) !important;
  }
  .blog-divider {
    width: 100%; height: 1px; background-color: var(--border); margin: 0 0 20px 0;
  }

  .blog-post-title {
    font-family: 'Geist', system-ui, sans-serif; font-weight: 500;
    font-size: clamp(24px, 2.8vw, 32px); line-height: 1.3;
    margin: 0 0 8px 0; color: var(--foreground);
  }
  .blog-date {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'zero' 1;
    font-size: clamp(12px, 0.85vw, 14px); color: var(--muted);
    margin-bottom: 20px;
  }
  .blog-content {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: clamp(15px, 1.1vw, 16px); line-height: 1.6;
    color: var(--muted-foreground);
  }
  .blog-content p { margin: 0 0 16px 0; }
  .blog-content a {
    color: var(--muted-foreground); text-decoration: underline;
    text-decoration-color: rgba(255,255,255,0.2); text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .blog-content a:hover {
    color: var(--blue); text-decoration-color: var(--blue);
  }
  /* Caps a too-wide or too-tall image to the column while keeping its proportions. */
  .blog-content img {
    max-width: 100%; max-height: 640px; width: auto; height: auto;
    display: block; border-radius: 6px; margin: 4px 0 20px 0;
  }

  /* Section headings — "/ Heading" and "// Subheading" in the editor. */
  .blog-content .blog-heading {
    font-family: 'Geist', system-ui, sans-serif; font-weight: 600;
    font-size: clamp(17px, 1.4vw, 19px); line-height: 1.35;
    color: var(--foreground); letter-spacing: -0.01em;
    margin: 32px 0 10px 0;
  }
  .blog-content .blog-subheading {
    font-family: 'Geist', system-ui, sans-serif; font-weight: 500;
    font-size: clamp(15px, 1.15vw, 16px); line-height: 1.4;
    color: var(--foreground);
    margin: 24px 0 8px 0;
  }
  .blog-content > *:first-child { margin-top: 0; }

  /* "> quoted line" */
  .blog-content blockquote {
    margin: 20px 0; padding: 2px 0 2px 18px;
    border-left: 2px solid var(--border);
    color: var(--muted); font-style: italic;
  }

  /* "- item", nested with "--", "---". Every level keeps the same single dash;
     depth shows in the indent alone. Each nested list steps in by its own
     padding plus the parent item's, so the ladder is even at any depth without
     a rule per level. */
  .blog-content ul {
    margin: 0 0 16px 0; padding-left: 0; list-style: none;
  }
  .blog-content ul ul { margin: 6px 0 0 0; padding-left: 0.4em; }
  .blog-content ul li {
    position: relative; padding-left: 1.4em; margin-bottom: 6px;
  }
  .blog-content ul li::before {
    content: '—'; position: absolute; left: 0; color: var(--muted);
  }

  /* Embedded tweets. Rendered from our own copy of the tweet — no third-party
     script, no tracking, and the card survives the tweet being deleted. */
  .blog-content .tweet {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin: 22px 0;
    background: rgba(255,255,255,0.02);
  }
  .blog-content .tweet-head {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; border-bottom: none; margin-bottom: 10px;
  }
  .blog-content .tweet-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: block; margin: 0; flex-shrink: 0;
  }
  .blog-content .tweet-who { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .blog-content .tweet-name {
    font-weight: 500; font-size: 15px; color: var(--foreground);
  }
  .blog-content .tweet-handle {
    font-size: 13px; color: var(--muted);
  }
  .blog-content .tweet-head:hover .tweet-name { color: var(--blue); }
  .blog-content .tweet-text {
    font-size: clamp(15px, 1.1vw, 16px); line-height: 1.5;
    color: var(--muted-foreground); white-space: pre-wrap; word-wrap: break-word;
  }
  .blog-content .tweet-date {
    display: inline-block; margin-top: 10px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--muted);
    text-decoration: none; border-bottom: none;
  }
  .blog-content .tweet-date:hover { color: var(--blue); }
  .blog-status {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: clamp(15px, 1.1vw, 16px);
    color: var(--muted); font-style: italic;
  }

  @media (max-width: 768px) {
    .page { flex-direction: column; }
    .sidebar {
      width: 100%; max-width: none; min-width: 0; height: auto;
      position: relative; padding: 24px 20px 0 20px; gap: 0;
    }
    .menu-toggle { display: block; }
    .nav { font-family: 'Geist', system-ui, sans-serif; display: none; }
    .content { padding: 20px; }
    .name { font-family: 'Geist', system-ui, sans-serif; font-size: 14px; letter-spacing: 0.04em; line-height: 1.15; margin: 0; }
    .clock { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.04em; line-height: 1.15; margin: 0; }
    .section { font-family: 'Geist', system-ui, sans-serif; max-width: 540px; }
  }
</style>

<body>
  <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">+</button>
  <div class="page">
    <aside class="sidebar" aria-label="Site identity">
      <div class="name"><a href="/index.html">ARYAMAN
KHANDELWAL</a></div>
      <div class="clock" id="dubai-clock" aria-label="Local time (Dubai, 24h)">17:00:00</div>
      <nav class="nav" aria-label="Primary">
        <a href="/blog.html">Blog</a>
        <a href="/forum.html">Jester's Courtyard</a>
        <a href="/builds.html">Builds</a>
        <a href="/tracker.html">Tracker</a>
        <a href="/interests.html">Interests</a>
        <a href="/livetweets.html">Live Tweets</a>
      </nav>
    </aside>
    <main class="content" id="main-content">
      <section class="section" aria-labelledby="blog-heading">
        <div class="blog-header">
          <div class="blog-nav">
            <a href="/blog.html" class="back-arrow"><</a>
            <span class="blog-label">BLOG</span>
          </div>
          <h1 class="blog-title">some of my thoughts</h1>
          <div class="blog-divider"></div>
        </div>

        <!-- Filled in from the API. Posts written in /admin/blog live in the
             database rather than in a file of their own, so they go live the
             moment they're published, with no redeploy. -->
        <h2 class="blog-post-title" id="post-title"></h2>
        <div class="blog-date" id="post-date"></div>
        <div class="blog-content" id="post-content"></div>
        <p class="blog-status" id="post-status">Loading…</p>
      </section>
    </main>
  </div>

  <div class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" hidden>
    <a href="/blog.html">Blog</a>
    <a href="/forum.html">Jester's Courtyard</a>
    <a href="/builds.html">Builds</a>
    <a href="/tracker.html">Tracker</a>
    <a href="/interests.html">Interests</a>
    <a href="/livetweets.html">Live Tweets</a>
  </div>

  <script>
    (function() {
      // Dubai clock with scramble animation
      const el = document.getElementById('dubai-clock');
      if (el) {
        const fmt = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Dubai',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        let isHovered = false;
        let scrambleAnim = null;

        function getTimeStr() {
          const parts = fmt.formatToParts(new Date());
          let hh = '00', mm = '00', ss = '00';
          for (const p of parts) {
            if (p.type === 'hour') hh = p.value;
            if (p.type === 'minute') mm = p.value;
            if (p.type === 'second') ss = p.value;
          }
          return hh + ':' + mm + ':' + ss;
        }

        function scrambleTo(target, done) {
          if (scrambleAnim) cancelAnimationFrame(scrambleAnim);
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:';
          const len = Math.max(el.textContent.length, target.length);
          const padded = target.padEnd(len);
          let iter = 0;
          const maxIter = 20;
          function step() {
            let out = '';
            let settled = 0;
            for (let i = 0; i < padded.length; i++) {
              if (iter >= maxIter - (padded.length - 1 - i)) {
                out += padded[i];
                settled++;
              } else {
                out += chars[Math.floor(Math.random() * chars.length)];
              }
            }
            el.textContent = out.trimEnd();
            iter++;
            if (settled < padded.length) {
              scrambleAnim = requestAnimationFrame(step);
            } else {
              scrambleAnim = null;
              if (done) done();
            }
          }
          scrambleAnim = requestAnimationFrame(step);
        }

        function update() {
          if (!isHovered) el.textContent = getTimeStr();
        }
        update();
        setInterval(update, 1000);

        el.addEventListener('mouseenter', function() {
          isHovered = true;
          scrambleTo('DUBAI');
        });
        el.addEventListener('mouseleave', function() {
          isHovered = false;
          scrambleTo(getTimeStr(), function() { isHovered = false; });
        });
        el.style.cursor = 'default';
      }

      // Mobile menu toggle
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('mobile-menu');
      function openMenu() {
        document.body.classList.add('menu-open');
        toggle.textContent = '×';
        toggle.setAttribute('aria-label', 'Close menu');
        toggle.setAttribute('aria-expanded', 'true');
        menu.hidden = false;
      }
      function closeMenu() {
        document.body.classList.remove('menu-open');
        toggle.textContent = '+';
        toggle.setAttribute('aria-label', 'Open menu');
        toggle.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      }
      if (toggle && menu) {
        toggle.addEventListener('click', function() {
          if (document.body.classList.contains('menu-open')) closeMenu(); else openMenu();
        });

        // Close on link click
        menu.addEventListener('click', function(e) {
          if (e.target.tagName === 'A') closeMenu();
        });
      }
    })();
  </script>

  <script>
    (function() {
      var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      var API_BASE = isLocal ? 'http://localhost:8000' : 'https://personalwebsite-xzmk.onrender.com';

      // Served both at /blogs/p/<slug> (via a Vercel rewrite) and, as a fallback
      // that always works, at /blogs/post.html?p=<slug>.
      var match = location.pathname.match(/\/blogs\/p\/([^\/?#]+)/);
      var slug = match ? decodeURIComponent(match[1])
                       : new URLSearchParams(location.search).get('p');

      var titleEl = document.getElementById('post-title');
      var dateEl = document.getElementById('post-date');
      var contentEl = document.getElementById('post-content');
      var statusEl = document.getElementById('post-status');

      function fail(message) {
        statusEl.textContent = message;
        statusEl.hidden = false;
      }

      if (!slug) { fail('No post specified.'); return; }

      fetch(API_BASE + '/blogposts/' + encodeURIComponent(slug))
        .then(function(res) {
          if (res.status === 404) throw new Error('Post not found.');
          if (!res.ok) throw new Error('Could not load this post.');
          return res.json();
        })
        .then(function(post) {
          document.title = post.title + ' – Aryaman Khandelwal';
          titleEl.textContent = post.title;
          dateEl.textContent = post.date_label || '';
          // Server-rendered from the editor text, with everything escaped there.
          contentEl.innerHTML = post.content_html;
          statusEl.hidden = true;
        })
        .catch(function(err) {
          fail(err.message || 'Could not load this post.');
        });
    })();
  </script>
</body>
